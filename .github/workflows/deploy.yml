# 自动部署信使：push 到 main → 调用 Render API 触发部署
# 背景：URL 方式接入的公开仓库，Render 不装 webhook，须由外部信使通知
# 密钥存放：GitHub Actions Secrets（加密存储，不进仓库代码）
name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: render-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Render 部署（部署当前 main HEAD）
        run: |
          set -euo pipefail
          RESPONSE=$(curl -sS -f -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}')
          echo "Render 响应: $RESPONSE"
        env:
          RENDER_SERVICE_ID: srv-da3sdqrm8hqs73d5pdqg
